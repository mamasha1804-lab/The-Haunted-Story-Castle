<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12062d">
  <meta name="description" content="The Haunted Story Castle — a magical Halloween story game for little learners.">
  <title>The Haunted Story Castle</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="fixes.css">
  <link rel="stylesheet" href="source-art.css">
</head>
<body class="mockup-body">
  <main class="mockup-wrap" aria-label="The Haunted Story Castle interactive game">
    <div class="mockup-canvas" id="castleCanvas" tabindex="-1">
      <img class="mockup-bg" src="assets/ChatGPT Image Aug 26, 2026, 01_21_56 AM.png" alt="The Haunted Story Castle game interface">

      <a class="hotspot nav-home" href="index.html" aria-label="Home"></a>
      <button class="hotspot nav-story" type="button" data-jump="story" aria-label="Story Castle"></button>
      <a class="hotspot nav-patch" href="pumpkin-patch.html" aria-label="Pumpkin Patch"></a>
      <button class="hotspot nav-cauldron future-link" type="button" data-room="Magic Cauldron" aria-label="Magic Cauldron"></button>
      <button class="hotspot nav-mystery future-link" type="button" data-room="Mystery House" aria-label="Mystery House"></button>
      <button class="hotspot nav-theatre future-link" type="button" data-room="Moonlight Theatre" aria-label="Moonlight Theatre"></button>

      <button class="hotspot icon-hot music-hot" id="musicToggle" type="button" aria-pressed="false" aria-label="Toggle magical background music"></button>
      <button class="hotspot icon-hot sound-hot" id="soundToggle" type="button" aria-pressed="true" aria-label="Toggle spoken sound"></button>
      <button class="hotspot icon-hot settings-hot" id="settingsToggle" type="button" aria-expanded="false" aria-controls="settingsPanel" aria-label="Open settings"></button>

      <button class="hotspot main-card who-card" data-roll="character" aria-label="Roll character"></button>
      <button class="hotspot main-card where-card" data-roll="setting" aria-label="Roll place"></button>
      <button class="hotspot main-card problem-card" data-roll="problem" aria-label="Roll event"></button>
      <button class="hotspot main-card surprise-card" data-roll="surprise" aria-label="Roll surprise"></button>

      <i class="card-art spr char p0 is-base" id="artCharacter" aria-hidden="true"></i>
      <i class="card-art spr loc p0 is-base" id="artSetting" aria-hidden="true"></i>
      <i class="card-art spr prob p0 is-base" id="artProblem" aria-hidden="true"></i>
      <i class="card-art spr sur p2 is-base" id="artSurprise" aria-hidden="true"></i>

      <button class="hotspot roll-story" id="rollStory" aria-label="Roll the Story"></button>
      <button class="hotspot roll-again" id="rollAgain" aria-label="Roll again"></button>
      <button class="hotspot read-aloud" id="readAloud" aria-label="Read story aloud"></button>
      <a class="hotspot patch-card-link" href="pumpkin-patch.html" aria-label="Play Pumpkin Patch Adventure"></a>
      <button class="hotspot room-cauldron future-link" type="button" data-room="Magic Cauldron" aria-label="Magic Cauldron coming soon"></button>
      <button class="hotspot room-mystery future-link" type="button" data-room="Mystery House" aria-label="Mystery House coming soon"></button>
      <button class="hotspot room-theatre future-link" type="button" data-room="Moonlight Theatre" aria-label="Moonlight Theatre coming soon"></button>

      <div class="dynamic-story" id="dynamicStory" aria-live="polite">
        <span id="storyText">A little witch went to the haunted castle, found a magic book, and suddenly a treasure chest popped open.</span>
      </div>
      <div class="dynamic-count"><strong id="storyCount">0</strong></div>

      <div class="selection-label label-character" id="labelCharacter">Witch</div>
      <div class="selection-label label-setting" id="labelSetting">Haunted Castle</div>
      <div class="selection-label label-problem" id="labelProblem">Finds a magic book</div>
      <div class="selection-label label-surprise" id="labelSurprise">A hidden treasure</div>

      <div class="side-choice character-choices" id="characterChoices"></div>
      <div class="side-choice setting-choices" id="settingChoices"></div>
      <div class="side-choice problem-choices" id="problemChoices"></div>
      <div class="side-choice surprise-choices" id="surpriseChoices"></div>

      <button class="hotspot side-roll side-roll-character" data-roll="character" aria-label="Roll character"></button>
      <button class="hotspot side-roll side-roll-setting" data-roll="setting" aria-label="Roll place"></button>
      <button class="hotspot side-roll side-roll-problem" data-roll="problem" aria-label="Roll event"></button>
      <button class="hotspot side-roll side-roll-surprise" data-roll="surprise" aria-label="Roll surprise"></button>

      <section class="settings-popover" id="settingsPanel" hidden aria-label="Game settings">
        <h2>Magic Settings</h2>
        <button type="button" id="settingsSpeech">Spoken English: On</button>
        <button type="button" id="settingsMusic">Background magic: Off</button>
        <button type="button" id="resetProgress">Reset story counter</button>
        <button type="button" id="closeSettings">Close</button>
      </section>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app-v2.js"></script>
</body>
</html>
