<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12062d">
  <meta name="description" content="Pumpkin Patch Adventure — a magical Halloween mini-game for little learners.">
  <title>Pumpkin Patch Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mockup-body">
  <main class="mockup-wrap" aria-label="Pumpkin Patch Adventure">
    <div class="mockup-canvas" id="patchCanvas">
      <img class="mockup-bg" src="assets/ChatGPT Image Aug 26, 2026, 01_22_04 AM.png" alt="Pumpkin Patch Adventure game interface">

      <a class="hotspot nav-home" href="index.html" aria-label="Back to Castle"></a>
      <button class="hotspot patch-start" id="startAdventure" aria-label="Start Adventure"></button>
      <button class="hotspot play-again-hot" id="playAgain" aria-label="Play again"></button>
      <a class="hotspot back-castle-hot" href="index.html" aria-label="Back to Castle"></a>
      <button class="hotspot collect-hot" id="collectReward" aria-label="Collect reward"></button>

      <button class="pumpkin-target pt1" aria-label="Hidden pumpkin 1"></button>
      <button class="pumpkin-target pt2" aria-label="Hidden pumpkin 2"></button>
      <button class="pumpkin-target pt3" aria-label="Hidden pumpkin 3"></button>
      <button class="pumpkin-target pt4" aria-label="Hidden pumpkin 4"></button>
      <button class="pumpkin-target pt5" aria-label="Hidden pumpkin 5"></button>

      <div class="patch-count" id="patchCount">0/5</div>
      <div class="patch-score" id="patchScore">0</div>

      <div class="patch-message" id="startMessage">
        <h2>Find 5 missing pumpkins!</h2>
        <p>Tap the glowing hiding places. Each pumpkin will say its English name.</p>
        <button id="closeStart">Let’s play!</button>
      </div>

      <div class="patch-clue" id="friendClue">
        <h3 id="friendClueText">Find the friendly ghost.</h3>
        <div class="clue-options">
          <button data-friend="ghost">Ghost</button>
          <button data-friend="cat">Black Cat</button>
          <button data-friend="witch">Witch</button>
        </div>
      </div>

      <div class="patch-message" id="candyGame">
        <h2 id="candyTitle">Put 3 candies in the basket!</h2>
        <div class="candy-choice-row" id="candyRow">
          <button>1</button><button>2</button><button>3</button><button>4</button><button>5</button>
        </div>
        <button id="checkCandy">Check Basket</button>
      </div>

      <div class="patch-message" id="winMessage">
        <h2>You found them all!</h2>
        <p>Great job! You earned <strong>10 candy stars</strong>.</p>
        <button id="closeWin">Play Again</button>
      </div>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="pumpkin.js"></script>
</body>
</html>
